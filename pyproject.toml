[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagos-building-footprints"
version = "0.1.0"
description = "U-Net building-footprint segmentation training on SpaceNet with Lagos transfer inference"
requires-python = ">=3.10"

[project.optional-dependencies]
model = [
  "geopandas>=0.14",
  "numpy>=1.26",
  "rasterio>=1.3",
  "shapely>=2.0",
  "torch>=2.1",
]
app = [
  "altair>=6.0",
  "pandas>=2.0",
  "pydeck>=0.9",
  "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]
